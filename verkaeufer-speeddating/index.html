  function start(){return `<section class="screen" id="start"><div class="site start-grid"><div class="start-copy"><div class="eyebrow">Verkäufer-Speeddating · Usedom</div><h1>Deine Immobilie in <span>100 Sekunden.</span></h1><p>Keine Bewertung. Kein Formularmarathon. Ein paar Fragen, ein bisschen klicken – danach wissen wir, worüber wir miteinander reden sollten.</p><p>Bis zum Schluss wird nichts abgeschickt. Versprochen.</p><div class="start-points"><span>Klicken</span><span>Wenig tippen</span><span>Keine Anmeldung</span></div><div class="signature"><span class="signature-line"></span><span>Persönlich. Klar. Usedom im Blick.</span></div></div><div class="card start-card"><div class="card-kicker">Bevor es losgeht</div><h2>Ein paar Fragen. Dann reden wir.</h2><p>Objektadresse, Eckdaten, Verkaufswunsch. Was du gerade nicht weißt, lässt du einfach offen.</p><button class="btn btn-gold btn-arrow" type="button" data-action="start">Speeddating starten</button></div></div></section>`}

  function contact(){return `<div class="contact-grid"><div class="field"><label for="first-name">Vorname</label><input id="first-name" data-input="firstName" autocomplete="given-name" value="${esc(state.firstName)}" placeholder="Vorname"></div><div class="field"><label for="last-name">Nachname</label><input id="last-name" data-input="lastName" autocomplete="family-name" value="${esc(state.lastName)}" placeholder="Nachname"></div><div class="field"><label for="email">E-Mail</label><input id="email" data-input="email" autocomplete="email" type="email" value="${esc(state.email)}" placeholder="name@beispiel.de"></div><div class="field"><label for="phone">Telefon</label><input id="phone" data-input="phone" autocomplete="tel" type="tel" value="${esc(state.phone)}" placeholder="Für ein persönliches Gespräch"></div><div class="field full"><label for="message">Deine Nachricht <span>(optional)</span></label><textarea id="message" data-input="message" placeholder="Was möchtest du uns noch mitgeben?">${esc(state.message)}</textarea></div><label class="privacy-check"><input type="checkbox" data-privacy ${state.privacy?'checked':''}><span>Ich bin damit einverstanden, dass meine Kontaktdaten für die gewünschte Rückmeldung verwendet werden.</span></label></div>`}
  function question(){const q=activeStep();let content='';if(q.type==='location')content=`<div class="location-intro">Adresse der Immobilie</div><div class="location-note">Hier geht es um die Adresse der Immobilie – nicht um deine eigene Adresse.</div><div class="location-options">${quickPlaces.map(([v,t])=>option(v,t,'locationChoice')).join('')}</div><div class="dual-fields location-fields"><div class="field"><label for="street">Straße der Immobilie</label><input id="street" data-input="street" autocomplete="street-address" value="${esc(state.street)}" placeholder="z. B. Strandstraße"></div><div class="field"><label for="house-number">Hausnummer</label><input id="house-number" data-input="houseNumber" value="${esc(state.houseNumber)}" placeholder="Nr."></div></div><div class="field"><label for="location-detail">Ort oder PLZ der Immobilie <span>(bei „Anderer Ort“ bitte ausfüllen)</span></label><input id="location-detail" data-input="locationDetail" value="${esc(state.locationDetail)}" placeholder="z. B. Heringsdorf oder 17424"></div>`;if(q.type==='choice')content=`<div class="option-grid">${q.options.map(([v,t])=>option(v,t,q.id)).join('')}</div>`;if(q.type==='multi'){content=`<div class="option-grid">${q.options.map(([v,t])=>option(v,t,q.id,true)).join('')}</div>`;if(state.highlights.includes('sea'))content+=`<div class="microreaction">Meerblick? Das ist schon einmal eine gute Gesprächseröffnung.</div>`}if(q.type==='basics')content=`<div class="metric-grid"><div class="field"><label for="area">Wohnfläche</label><input id="area" data-input="area" inputmode="decimal" value="${esc(state.area)}" placeholder="z. B. 120 m²"></div><div class="field"><label for="rooms">Zimmer</label><input id="rooms" data-input="rooms" inputmode="decimal" value="${esc(state.rooms)}" placeholder="z. B. 4"></div><div class="field"><label for="bathrooms">Bäder</label><input id="bathrooms" data-input="bathrooms" inputmode="decimal" value="${esc(state.bathrooms)}" placeholder="z. B. 2"></div></div>`;if(q.type==='age')content=`<div class="option-grid">${option('altbau','Altbau','ageType')}${option('neubau','Neubau','ageType')}${option('unknown','Weiß ich gerade nicht','ageType')}</div><div class="dual-fields"><div class="field"><label for="baujahr">Ursprüngliches Baujahr <span>(optional)</span></label><input id="baujahr" data-input="baujahr" inputmode="numeric" value="${esc(state.baujahr)}" placeholder="z. B. 1928"></div><div class="field"><label for="kernsanierung">Letzte Kernsanierung oder Modernisierung <span>(optional)</span></label><input id="kernsanierung" data-input="kernsanierung" inputmode="numeric" value="${esc(state.kernsanierung)}" placeholder="z. B. 2018"></div></div>`;if(q.type==='textarea')content=`<div class="single-field"><div class="field"><label for="free-text">Deine Notiz <span>(optional)</span></label><textarea id="free-text" data-input="${esc(q.id)}" placeholder="${esc(q.placeholder||'Ein Satz reicht.')}">${esc(state[q.id])}</textarea></div></div>`;if(q.type==='price')content=`<div class="option-grid">${q.options.map(([v,t])=>option(v,t,'priceType')).join('')}</div><div class="single-field"><div class="field"><label for="price">Preisvorstellung <span>(optional)</span></label><input id="price" data-input="price" inputmode="decimal" value="${esc(state.price)}" placeholder="z. B. 495.000 €"></div></div>`;if(q.type==='documents'){content=`<div class="option-grid">${documentOptions().map(([v,t])=>option(v,t,'documents',true)).join('')}</div>`}if(q.type==='contact')content=contact();const idx=current+1,total=activeSteps().length;return `<section class="screen quiz-screen"><div class="site"><div class="quiz-head"><div class="quiz-count">Runde <strong>${idx} von 16</strong></div><div class="progress-box"><div class="progress-label"><span>${q.id==='contact'?'Deine Angaben im Blick':'Dein Profil nimmt Form an'}</span><span>${Math.round(idx/total*100)} %</span></div><div class="progress"><div class="progress-bar" style="width:${idx/total*100}%"></div></div></div></div><div class="quiz-grid">${aside()}<div class="card question-card"><div class="eyebrow">${q.id==='contact'?'Der persönliche Teil':q.required?'Eine wichtige Runde':'Eine optionale Runde'}</div><h1>${esc(q.title)}</h1><p class="question-hint">${esc(q.hint)}</p>${content}${q.id==='contact'?'<div class="contact-disclaimer">Prüfe deine Angaben in Ruhe. Erst danach melden wir uns wie gewünscht.</div>':''}<div class="question-error" role="alert">${esc(error)}</div><div class="question-actions"><button type="button" class="btn btn-plain" data-action="back">← Zurück</button><div class="question-actions-right">${!q.required&&q.id!=='contact'?'<button type="button" class="btn btn-plain" data-action="skip">Überspringen</button>':''}<button type="button" class="btn btn-gold btn-arrow" data-action="next">${q.id==='contact'?'Angaben prüfen':'Weiter'}</button></div></div></div></div></div></section>`}
  const fmt=v=>v?esc(v):'<span class="pending">noch offen</span>';
  const mailValue=v=>String(v??'').trim()||'nicht angegeben';
  function openMail(){
    saveInputs();
    const fullName=`${state.firstName} ${state.lastName}`.trim();
    const basics=[state.area?`${state.area} m²`:'',state.rooms?`${state.rooms} Zimmer`:'',state.bathrooms?`${state.bathrooms} Bäder`: ''].filter(Boolean).join(' · ');
    const age=[label('ageType',state.ageType),state.baujahr?`Baujahr ${state.baujahr}`:'',state.kernsanierung?`modernisiert ${state.kernsanierung}`:''].filter(Boolean).join(' · ');
    const address=`${state.street} ${state.houseNumber}`.trim();
    const answers=[
      ['Adresse der Immobilie',[address,locationText()].filter(Boolean).join(', ')],
      ['Objektart',label('property',state.property)],

      ['Altbau oder Neubau · Baujahr',age],

      ['Zustand',label('condition',state.condition)],

      ['Was sollte man gesehen haben?',state.sight],

      ['Zeitpunkt',label('timing',state.timing)],

    const body=`${greeting}\\n\\nHier sind meine Angaben zur Immobilie:\\n\\n${summary}\\n\\nIch freue mich auf eure Rückmeldung.\\n\\nViele Grüße\\n${mailValue(fullName)}`;
    const subject=`Verkäufer-Speeddating – Zusammenfassung zur Immobilie${fullName?` von ${fullName}`:''}`;
    window.location.href=`mailto:anfragen@immobilien-kaiserbaeder.de?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }
  function result(){const basics=[state.area?`${state.area} m²`: '',state.rooms?`${state.rooms} Zimmer`:'',state.bathrooms?`${state.bathrooms} Bäder`: ''].filter(Boolean).join(' · ');const age=[label('ageType',state.ageType),state.baujahr?`Baujahr ${state.baujahr}`:'',state.kernsanierung?`modernisiert ${state.kernsanierung}`:''].filter(Boolean).join(' · ');const rows=[['Adresse der Immobilie',`${state.street} ${state.houseNumber}, ${locationText()}`.replace(/^, |, $/g,'')],['Objektart',label('property',state.property)],['Wohnfläche · Zimmer · Bäder',basics],['Altbau oder Neubau · Baujahr',age],['Etage',state.property==='apartment'?label('floor',state.floor):'nicht relevant bei einem Haus'],['Zustand',label('condition',state.condition)],['Besonderheiten',state.highlights.map(v=>label('highlights',v)).join(', ')],['Parken',label('parking',state.parking)],['Was sollte man gesehen haben?',state.sight],['Preisvorstellung',[label('priceType',state.priceType),state.price].filter(Boolean).join(' · ')],['Unterlagen',state.documents.map(v=>documentOptions().find(x=>x[0]===v)?.[1]||v).join(', ')],['Verkaufsgrund',label('reason',state.reason)],['Zeitpunkt',label('timing',state.timing)],['Verkaufsziel',label('sellingGoal',state.sellingGoal)],['Gewünschte Unterstützung',(Array.isArray(state.help)?state.help:state.help?[state.help]:[]).map(v=>label('help',v)).join(', ')],['Name',`${state.firstName} ${state.lastName}`.trim()],['E-Mail',state.email],['Telefon',state.phone],['Nachricht',state.message]];return `<section class="screen result-screen"><div class="site"><div class="result-heading"><div class="eyebrow">So. Jetzt haben wir ein Bild.</div><h1>Passt. Jetzt kennen wir deine Immobilie schon ein bisschen.</h1><p>Die wichtigsten Angaben für unser Gespräch – keine automatische Bewertung.</p></div><div class="result-layout"><div class="card result-card"><div class="result-card-head"><div><div class="card-kicker">Verkäufer-Speeddating · ${esc(`${state.firstName} ${state.lastName}`.t   function saveInputs(){document.querySelectorAll('[data-input]').forEach(el=>state[el.dataset.input]=el.value.trim());const privacy=document.querySelector('[data-privacy]');if(privacy)state.privacy=privacy.checked}
  function valid(q){if(q.id==='location')return !!(state.locationChoice&&state.street&&state.houseNumber&&(state.locationDetail||state.locationChoice!=='other'));if(q.id==='property')return !!state.property;if(q.id==='sellingGoal')return !!state.sellingGoal;if(q.id==='contact')return !!(state.firstName&&state.lastName&&(state.email||state.phone)&&state.privacy);return true}
  function clearState(){Object.keys(originalState).forEach(k=>state[k]=Array.isArray(originalState[k])?[]:'');state.privacy=false}
  function next(){saveInputs();const q=activeStep();if(!valid(q)){error=q.id==='contact'?'Bitte ergänze die Kontaktdaten und bestätige den Datenschutzhinweis.':'Wähle eine Antwort aus – oder überspringe diese Runde.';render();return}error='';if(current<activeSteps().length-1){current++;render(true)}else{view='result';render(true)}}
  function render(scrollToTop=false){app.innerHTML=view==='start'?start():view==='quiz'?question():result();bind();if(scrollToTop)window.scrollTo({top:0,behavior:'smooth'})}
  function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{const a=el.dataset.action;if(a==='start'){view='quiz';current=0;error='';render(true)}if(a==='back'){saveInputs();if(current>0){current--;error='';render(true)}else{view='start';render()}}if(a==='skip'){saveInputs();if(current<activeSteps().length-1){current++;error='';render(true)}}if(a==='next')next();if(a==='print')window.print();if(a==='email')openMail();if(a==='edit'){view='quiz';current=0;render()}if(a==='restart'){clearState();view='start';current=0;error='';render()}}));document.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{const group=el.dataset.group,value=el.dataset.choice;if(el.dataset.multi==='true'){const arr=state[group]||[];if(value==='none'||value==='unknown'){state[group]=arr.includes(value)?[]:[value]}else{state[group]=arr.filter(v=>v!=='none'&&v!=='unknown');state[group]=state[group].includes(value)?state[group].filter(v=>v!==value):[...state[group],value]}}else{state[group]=value;if(group==='property'&&value==='house')state.floor=''}error='';render()}));document.querySelectorAll('[data-input]').forEach(el=>el.addEventListener('input',()=>{state[el.dataset.input]=el.value}));const privacy=document.querySelector('[data-privacy]');if(privacy)privacy.addEventListener('change',()=>{state.privacy=privacy.checked;error=''})}
  const style=document.createElement('style');style.textContent=`
    .start-note{margin:20px 0 25px;padding:14px 15px;border-left:2px solid var(--gold);background:var(--gold-soft);color:var(--graphite);font-size:12px;line-height:1.5}.start-note strong{color:var(--ink)}
    .location-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:700px}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;max-width:650px}.contact-grid .full{grid-column:1/-1}.contact-grid .field{margin-top:17px}.contact-grid .field label span{font-weight:400;letter-spacing:0;text-transform:none}.privacy-check{grid-column:1/-1;display:flex;align-items:flex-start;gap:10px;margin-top:20px;color:var(--muted);font-size:11px;line-height:1.45}.privacy-check input{flex:0 0 auto;margin-top:3px;accent-color:var(--gold)}.contact-disclaimer{margin-top:24px;padding:13px 15px;border-left:2px solid var(--gold);background:var(--gold-soft);color:var(--graphite);font-size:11px;line-height:1.5}.microreaction{margin-top:17px;color:var(--gold-deep);font-size:12px;font-weight:700}.question-card:before{background:var(--gold)}
    @media(max-width:760px){.location-options,.metric-grid,.contact-grid{grid-template-columns:1fr}.contact-grid .full{grid-column:auto}.privacy-check{grid-column:auto}.location-options .option{min-height:54px}}
  `;document.head.appendChild(style);render();
})();
</script>
